<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pi Web</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1a1a1a">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #16161a; color: #e8e8ea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    padding: 24px; -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%; max-width: 460px; padding: 32px 28px;
    background: #1f1f24; border: 1px solid #2e2e35; border-radius: 16px;
    text-align: center;
  }
  .logo {
    width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 15px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(145deg, #3a3a44, #26262d);
    font-size: 30px; line-height: 1; color: #fff;
  }
  h1 { margin: 0 0 6px; font-size: 19px; font-weight: 600; letter-spacing: .2px; }
  .sub { margin: 0 0 22px; font-size: 13px; color: #8b8b96; }
  .bar {
    height: 3px; border-radius: 2px; background: #2a2a31; overflow: hidden;
    margin-bottom: 20px;
  }
  .bar > i {
    display: block; height: 100%; width: 35%; border-radius: 2px;
    background: linear-gradient(90deg, #5b8def, #8f6bf0);
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(320%); }
  }
  .btn {
    display: inline-block; padding: 11px 22px; border-radius: 9px;
    background: #3f6fe0; color: #fff; text-decoration: none;
    font-size: 14px; font-weight: 500;
  }
  .btn:hover { background: #4d7bea; }
  .addr {
    margin: 18px 0 0; padding: 9px 12px; border-radius: 8px;
    background: #17171b; border: 1px solid #2a2a31;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px; color: #7d7d89; word-break: break-all; text-align: left;
  }
  .tip { margin: 14px 0 0; font-size: 12px; line-height: 1.65; color: #6b6b76; }
  .warn { color: #d9a44a; }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">π</div>
    <h1>Pi Web</h1>
    <p class="sub" id="sub">正在跳转…</p>
    <div class="bar"><i></i></div>
    <a class="btn" id="manual" href="#">手动打开</a>
    <p class="addr" id="addr"></p>
    <p class="tip" id="tip">
      目标为内网地址，需能访问内网才能打开。
    </p>
  </main>
<script>
(function () {
  // 后端入口：改这一行即可
  var TARGET = 'http://11.167.34.150:1024/';

  // 原样透传 query（session / cwd / sidebar 等）
  var url = TARGET + (window.location.search || '');

  document.getElementById('addr').textContent = url;
  document.getElementById('manual').href = url;

  var jumped = false;
  try {
    window.location.replace(url);
    jumped = true;
  } catch (e) {}

  // 2.5s 后仍在本页，说明跳转未生效，给出提示
  setTimeout(function () {
    var sub = document.getElementById('sub');
    var tip = document.getElementById('tip');
    sub.textContent = '未自动跳转，请点下方按钮';
    tip.className = 'tip warn';
    tip.textContent = '若手动打开后仍失败，通常是当前设备不在内网，或后端未启动。';
  }, 2500);
})();
</script>
</body>
</html>
